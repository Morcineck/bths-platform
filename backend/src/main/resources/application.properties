spring.application.name=platform

spring.datasource.url=jdbc:mysql://localhost:3306/bths_platform
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI - desativado por padrao
springdoc.api-docs.enabled=${BTHS_OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${BTHS_OPENAPI_ENABLED:false}

# Temporariamente desativado ate validarmos a migracao inicial
spring.flyway.enabled=${BTHS_FLYWAY_ENABLED:false}