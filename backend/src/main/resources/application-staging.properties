
# Banco de dados exclusivo do ambiente de staging
spring.datasource.url=${BTHS_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate valida o schema sem modifica-lo
spring.jpa.hibernate.ddl-auto=validate

# Flyway executa as migracoes versionadas
spring.flyway.enabled=true
