# Banco de dados exclusivo do ambiente de staging
spring.datasource.url=${BTHS_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Migracoes: usuario proprio com permissao de DDL (a conexao da aplicacao nao altera o schema)
spring.flyway.url=${BTHS_DB_URL}
spring.flyway.user=${BTHS_DB_MIGRACAO_USUARIO}
spring.flyway.password=${BTHS_DB_MIGRACAO_SENHA}

# Hibernate valida o schema sem modifica-lo
spring.jpa.hibernate.ddl-auto=validate

# Desativar exibicao de consultas SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway executa as migracoes versionadas
spring.flyway.enabled=true

# Observabilidade - Issue #68
# Logs estruturados em JSON (Elastic Common Schema)
logging.structured.format.console=ecs

# Nao registrar valores rejeitados em erros de validacao (podem conter senha e CPF)
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR

# Cookie de autenticacao
bths.auth.cookie-secure=true

# CORS
# Obrigatorio: a aplicacao nao inicia sem a variavel, para nunca herdar a origem de desenvolvimento.
bths.cors.allowed-origins=${BTHS_CORS_ALLOWED_ORIGINS}