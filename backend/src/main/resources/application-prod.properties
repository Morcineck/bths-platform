# Banco de dados de producao
spring.datasource.url=${BTHS_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate apenas valida a estrutura
spring.jpa.hibernate.ddl-auto=validate

# Flyway gerencia as migracoes
spring.flyway.enabled=true

# Desativar exibicao de consultas SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logs estruturados em JSON (Elastic Common Schema)
logging.structured.format.console=ecs

# Nao registrar valores rejeitados em erros de validacao (podem conter senha e CPF)
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR

# Cookie de autenticacao
bths.auth.cookie-secure=true

# CORS
# Obrigatorio: a aplicacao nao inicia sem a variavel, para nunca herdar a origem de desenvolvimento.
bths.cors.allowed-origins=${BTHS_CORS_ALLOWED_ORIGINS}