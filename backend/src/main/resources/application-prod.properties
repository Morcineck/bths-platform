# Banco de dados de producao
spring.datasource.url=${BTHS_DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate apenas valida a estrutura
spring.jpa.hibernate.ddl-auto=validate

# Flyway gerencia as migracoes
spring.flyway.enabled=true

# Desativar exibicao de consultas SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logs estruturados em JSON (Elastic Common Schema)
logging.structured.format.console=ecs
