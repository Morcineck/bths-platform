name: bths-compose
x-logging: &padrao-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    logging: *padrao-logging
    environment:
      MYSQL_DATABASE: bths_compose
      MYSQL_ROOT_PASSWORD: ${BTHS_COMPOSE_ROOT_PASSWORD:?Defina a senha root do Compose}
      # #71: usuarios criados pelo script criar-usuarios.sh, com privilegios minimos
      BTHS_DB_NAME: bths_compose
      BTHS_APP_USER: bths_compose
      BTHS_APP_PASSWORD: ${BTHS_COMPOSE_DB_PASSWORD:?Defina a senha do banco Compose}
      BTHS_MIGRACAO_USER: bths_compose_migracao
      BTHS_MIGRACAO_PASSWORD: ${BTHS_COMPOSE_MIGRACAO_PASSWORD:?Defina a senha de migracao do Compose}
    volumes:
      - bths_mysql_data:/var/lib/mysql
      - ./docker/mysql/criar-usuarios.sh:/docker-entrypoint-initdb.d/criar-usuarios.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysql --protocol=tcp -h 127.0.0.1 -u "$$BTHS_APP_USER" -p"$$BTHS_APP_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - bths_internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *padrao-logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: staging
      BTHS_AUTH_COOKIE_SECURE: "false"
      BTHS_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      BTHS_DB_URL: jdbc:mysql://mysql:3306/bths_compose
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bths_compose
      DB_USERNAME: bths_compose
      DB_PASSWORD: ${BTHS_COMPOSE_DB_PASSWORD:?Defina a senha do banco Compose}
      # #71: usuario exclusivo das migracoes do Flyway
      BTHS_DB_MIGRACAO_USUARIO: bths_compose_migracao
      BTHS_DB_MIGRACAO_SENHA: ${BTHS_COMPOSE_MIGRACAO_PASSWORD:?Defina a senha de migracao do Compose}
      JWT_SECRET: ${BTHS_COMPOSE_JWT_SECRET:?Defina o segredo JWT do Compose}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

    healthcheck:
      test:
        - CMD-SHELL
        - 'curl --fail --silent --output /dev/null http://127.0.0.1:8080/actuator/health/readiness'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

    networks:
      - bths_internal

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        BTHS_INTERNAL_API_URL: http://backend:8080
    restart: unless-stopped
    logging: *padrao-logging
    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - bths_internal

networks:
  bths_internal:
    driver: bridge

volumes:
  bths_mysql_data: